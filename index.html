<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0f12'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' fill='%237fd6a0' text-anchor='middle'%3E%40%3C/text%3E%3C/svg%3E" />
    <title>ASCII Bot Shooter</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --fg: #c8d0d8;
        --dim: #6b7682;
        --line: #212a33;
        --accent: #7fd6a0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        height: 100dvh;
        gap: 8px;
        padding: 8px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .dim { color: var(--dim); }
      .meta { font-size: 0.75rem; }
      #stage {
        min-height: 0;
        min-width: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
      }
      #arena {
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #panel {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.75rem;
      }
      #score { font-size: 0.9rem; letter-spacing: 0.04em; }
      #feed {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
        max-height: 4.6em;
        color: var(--dim);
        line-height: 1.5;
      }
      #feed li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed li + li { margin-top: 1px; }
      #feed li:last-child { color: var(--fg); }
      /* A wide screen puts the panel beside the arena (Section 7.18). */
      @media (min-width: 980px) {
        #stage {
          grid-template-rows: minmax(0, 1fr);
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        #panel {
          border-left: 1px solid var(--line);
          padding-left: 12px;
        }
        #feed { max-height: none; flex: 1; }
        /* The panel is wide enough for a full line, so it wraps instead. */
        #feed li { white-space: normal; text-overflow: clip; }
      }
      footer {
        border-top: 1px solid var(--line);
        padding-top: 6px;
        font-size: 0.72rem;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: var(--dim);
      }
      footer b { font-weight: 400; color: var(--fg); }
      #bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      #controls { display: flex; gap: 6px; }
      #controls button {
        min-height: 40px;
        min-width: 56px;
        padding: 0 12px;
        font: inherit;
        font-size: 0.8rem;
        color: var(--fg);
        background: #161c22;
        border: 1px solid var(--line);
        border-radius: 5px;
        cursor: pointer;
      }
      #controls button:hover:not(:disabled) { border-color: #38444f; }
      #controls button:disabled { opacity: 0.4; cursor: default; }
      #controls button[aria-pressed="true"] {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
      }
      #status { font-size: 0.78rem; color: var(--dim); }
      /* A short screen (a phone in landscape) gives the arena more height. */
      @media (max-height: 540px) {
        #app { gap: 4px; padding: 4px 8px; }
        header { padding-bottom: 3px; }
        h1 { font-size: 0.8rem; }
        .meta { font-size: 0.68rem; }
        #bar { padding-top: 3px; }
        #stage { gap: 4px; }
        #feed { max-height: 1.5em; }
        #controls button { min-height: 34px; min-width: 48px; padding: 0 8px; }
        footer { padding-top: 3px; font-size: 0.66rem; gap: 2px 10px; }
      }
      .error {
        margin: auto;
        max-width: 40rem;
        padding: 12px;
        border: 1px solid #5a2b2b;
        border-radius: 6px;
        color: #e0a0a0;
        white-space: pre-wrap;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ASCII BOT SHOOTER</h1>
        <span class="meta dim" id="meta"></span>
      </header>
      <div id="stage">
        <main id="arena"></main>
        <aside id="panel">
          <div id="score"></div>
          <ul id="feed"></ul>
        </aside>
      </div>
      <div id="bar">
        <div id="controls"></div>
        <span id="status"></span>
      </div>
      <footer id="legend"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
