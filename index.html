<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0f12'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' fill='%237fd6a0' text-anchor='middle'%3E%40%3C/text%3E%3C/svg%3E" />
    <title>ASCII Bot Shooter</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --fg: #c8d0d8;
        --dim: #6b7682;
        --accent: #7fd6a0;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 { font-size: 1.4rem; margin: 0; color: var(--accent); letter-spacing: 0.08em; }
      p { margin: 0; line-height: 1.6; }
      .dim { color: var(--dim); }
      pre {
        margin: 0;
        padding: 12px;
        border: 1px solid #222a33;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
