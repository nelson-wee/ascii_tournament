<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060d'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' fill='%236ef7ff' text-anchor='middle'%3E%40%3C/text%3E%3C/svg%3E" />
    <title>ASCII Bot Shooter</title>
    <style>
      /* The neon look of Section 7.18. The arena carries a palette of its
         own, from the seed of the run; the page chrome holds still around it,
         so the eye reads the arena and not the frame. */
      :root {
        color-scheme: dark;
        --bg: #05060d;
        --panel: #090c18;
        --fg: #cdd6f4;
        --dim: #6b7694;
        --line: #1b2440;
        --accent: #6ef7ff;
        --accent-dim: #2a6b7a;
        --neon-a: #4de3ff;
        --neon-b: #ff3d8f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background:
          radial-gradient(120% 90% at 50% 0%, #0c1030 0%, rgba(5, 6, 13, 0) 60%),
          var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        height: 100dvh;
        gap: 8px;
        padding: 8px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        color: var(--accent);
        /* Glow on the page chrome is a text shadow. The arena uses the canvas
           shadow instead: a CSS blur over a full canvas is not cheap. */
        text-shadow: 0 0 10px rgba(110, 247, 255, 0.55);
      }
      .dim { color: var(--dim); }
      .meta { font-size: 0.75rem; }
      #stage {
        min-height: 0;
        min-width: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
      }
      #arena {
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The two canvases of Section 7.18: the grid below, the effects above.
         They hold the same pixel size and the same cell grid. Only the top one
         takes the shake of a blast. */
      .neon-stage {
        position: relative;
        line-height: 0;
        border-radius: 4px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--line),
          0 0 34px rgba(80, 120, 255, 0.16);
      }
      .neon-stage canvas { display: block; }
      .neon-vfx {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #panel {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.75rem;
      }
      #score { font-size: 0.9rem; letter-spacing: 0.04em; }
      #feed {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
        max-height: 4.6em;
        color: var(--dim);
        line-height: 1.5;
      }
      /* The bot status of Section 7.18.6: what each bot can do next. */
      .bots {
        margin: 0 0 2px;
        padding: 0;
        list-style: none;
        font-size: 0.7rem;
        line-height: 1.45;
      }
      .bot {
        display: grid;
        grid-template-columns: 5.2em minmax(0, 1fr) 3.4em 3.2em 1.8em auto;
        align-items: center;
        gap: 0 5px;
        border-top: 1px solid var(--line);
        padding: 1px 0;
        white-space: nowrap;
      }
      .bot-name { color: var(--team, var(--fg)); font-weight: 400; }
      .bot-weapon {
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--fg);
      }
      .bot-ammo { color: var(--dim); text-align: right; }
      .bot-track {
        position: relative;
        height: 5px;
        border: 1px solid var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .bot-bar {
        display: block;
        height: 100%;
        background: var(--team, var(--fg));
        transition: width 90ms linear;
      }
      .bot-health { color: var(--dim); text-align: right; }
      .bot-armor { color: #7fd6a0; }
      .bot-powerups { color: #b98ad6; letter-spacing: 1px; }
      .bot.down { opacity: 0.42; }
      /* A bot that is down says one thing, so it takes the whole row. */
      .bot.down .bot-weapon {
        grid-column: 2 / -1;
        color: var(--dim);
        font-style: italic;
      }
      .bot.down .bot-track { display: none; }
      #feed li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed li + li { margin-top: 1px; }
      #feed li:last-child { color: var(--fg); }
      #feed li.announce { color: #ffd166; }
      #feed li.spreeEnded { color: #ff6a8a; }
      #feed li.suddenDeath { color: var(--accent); letter-spacing: 0.1em; }
      #status.urgent { color: var(--accent); }
      /* A wide screen puts the panel beside the arena (Section 7.18). */
      @media (min-width: 980px) {
        #stage {
          grid-template-rows: minmax(0, 1fr);
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        #panel {
          border-left: 1px solid var(--line);
          padding-left: 12px;
        }
        #feed { max-height: none; flex: 1; }
        /* The panel is wide enough for a full line, so it wraps instead. */
        #feed li { white-space: normal; text-overflow: clip; }
      }
      footer {
        border-top: 1px solid var(--line);
        padding-top: 6px;
        font-size: 0.72rem;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: var(--dim);
      }
      footer b { font-weight: 400; color: var(--fg); }
      #bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      #controls { display: flex; gap: 6px; }
      #controls button {
        min-height: 40px;
        min-width: 56px;
        padding: 0 12px;
        font: inherit;
        font-size: 0.8rem;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        cursor: pointer;
      }
      #controls button:hover:not(:disabled):not([aria-pressed="true"]) {
        border-color: var(--accent-dim);
        color: var(--accent);
      }
      #controls button:disabled { opacity: 0.4; cursor: default; }
      #controls button[aria-pressed="true"] {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 14px rgba(110, 247, 255, 0.4);
      }
      #status { font-size: 0.78rem; color: var(--dim); }
      /* A short screen (a phone in landscape) gives the arena more height. */
      @media (max-height: 540px) {
        #app { gap: 4px; padding: 4px 8px; }
        header { padding-bottom: 3px; }
        h1 { font-size: 0.8rem; }
        .meta { font-size: 0.68rem; }
        #bar { padding-top: 3px; }
        #stage { gap: 4px; }
        #feed { max-height: 1.5em; }
        .bots { font-size: 0.64rem; line-height: 1.3; }
        #controls button { min-height: 34px; min-width: 48px; padding: 0 8px; }
        footer { padding-top: 3px; font-size: 0.66rem; gap: 2px 10px; }
      }
      /* The between-round tactics screen (Section 7.4). */
      #stage { position: relative; }
      .screen {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: rgba(5, 6, 13, 0.96);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: inset 0 0 60px rgba(80, 120, 255, 0.08);
      }
      .screen h2 {
        margin: 0;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(110, 247, 255, 0.45);
      }
      .screen p { margin: 0; font-size: 0.72rem; }
      .tactics {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 640px) {
        .tactics { grid-template-columns: 1fr 1fr; gap: 6px 20px; }
      }
      .tactic {
        display: grid;
        grid-template-columns: 8.5em minmax(0, 1fr);
        align-items: center;
        gap: 2px 8px;
        font-size: 0.74rem;
      }
      .tactic-name { color: var(--fg); }
      .tactic-help { grid-column: 2; font-size: 0.66rem; }
      .tactic-control { display: flex; align-items: center; gap: 6px; }
      .tactic input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
      .tactic output { width: 2.4em; text-align: right; color: var(--dim); }
      .tactic select {
        font: inherit;
        font-size: 0.74rem;
        min-height: 32px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0 6px;
      }
      .menu-group {
        border-top: 1px solid var(--line);
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .menu-group h3 {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        color: var(--fg);
      }
      .menu-styles { display: flex; flex-wrap: wrap; gap: 6px; }
      .screen .choice {
        min-height: 40px;
        padding: 0 14px;
        font: inherit;
        font-size: 0.76rem;
        text-align: left;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        cursor: pointer;
      }
      .screen .choice:hover {
        border-color: var(--accent);
        box-shadow: 0 0 12px rgba(110, 247, 255, 0.18);
      }
      .screen .start {
        align-self: flex-start;
        min-height: 40px;
        padding: 0 16px;
        font: inherit;
        font-size: 0.8rem;
        color: var(--bg);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 5px;
        cursor: pointer;
        box-shadow: 0 0 16px rgba(110, 247, 255, 0.35);
      }
      .error {
        margin: auto;
        max-width: 40rem;
        padding: 12px;
        border: 1px solid #5a2b2b;
        border-radius: 6px;
        color: #e0a0a0;
        white-space: pre-wrap;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ASCII BOT SHOOTER</h1>
        <span class="meta dim" id="meta"></span>
      </header>
      <div id="stage">
        <main id="arena"></main>
        <aside id="panel">
          <div id="score"></div>
          <div id="bots"></div>
          <ul id="feed"></ul>
        </aside>
      </div>
      <div id="bar">
        <div id="controls"></div>
        <span id="status"></span>
      </div>
      <footer id="legend"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
